# Deploy this file to the KB repo at .github/workflows/blog-ingest.yml
#
# Runs the kb-blog-curator managed agent twice daily:
#   07:00 PT → morning  (14:00 UTC during PDT / 15:00 UTC during PST)
#   18:00 PT → evening  (01:00 UTC during PDT / 02:00 UTC during PST)
#
# Cost architecture (2026-07): the workflow now pre-fetches feeds and ranks
# candidates in Python + one cheap Haiku call BEFORE creating the Sonnet
# session — see scripts/run-blog-ingest.py. Only the morning slot runs
# web-search discovery. An evening run with nothing to analyze skips the
# session entirely.
#
# The cron expressions are PDT-aligned (matching the current date range).
# They will drift by 1 hour during PST (Nov–Mar). GitHub Actions cron is UTC
# and does not understand DST. If you care about hard-locked clock times,
# rotate these twice a year or accept the drift.

name: kb-blog-curator

on:
  schedule:
    - cron: '0 14 * * *'   # 07:00 PDT / 06:00 PST — morning
    - cron: '0 1 * * *'    # 18:00 PDT / 17:00 PST — evening
  workflow_dispatch:       # manual trigger from the Actions tab
    inputs:
      slot:
        description: 'Slot name (morning/evening/manual)'
        required: false
        default: 'manual'
      url:
        description: 'Optional: single URL to analyze (skips discovery/ranking/synthesis)'
        required: false
        default: ''

permissions:
  contents: write          # the managed agent pushes to this repo via its own clone;
                           # GITHUB_TOKEN still needs write if we ever want to commit
                           # workflow-side artifacts (not used yet)

concurrency:
  # Prevent two concurrent runs from fighting git push
  group: kb-blog-curator
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # a session that takes this long is a red flag — fail fast

    steps:
      - name: Determine slot
        id: slot
        env:
          # github.event.schedule is the literal cron expression that triggered
          # this run. It's set by GitHub at queue time, so it's correct even when
          # the runner starts hours late (which is common during peak load).
          # Do NOT derive the slot from `date -u +%H` — a delayed run will read
          # the wrong hour and fall through to the default case.
          TRIGGERING_CRON: ${{ github.event.schedule }}
          DISPATCH_SLOT:   ${{ github.event.inputs.slot }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$TRIGGERING_CRON" in
              '0 14 * * *') slot=morning ;;   # 07:00 PDT / 06:00 PST
              '0 1 * * *')  slot=evening ;;   # 18:00 PDT / 17:00 PST
              *)            slot=manual  ;;   # unrecognized cron — shouldn't happen
            esac
            echo "slot=$slot (from cron '$TRIGGERING_CRON')"
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
          else
            echo "slot=${DISPATCH_SLOT:-manual}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout runner script + pipeline state
        # The runner pre-fetches feeds and ranks candidates before creating
        # the session, so it needs the feed cache, dedupe log, and profile
        # files as well as the scripts. The managed agent still clones the
        # full KB itself as a session resource.
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/run-blog-ingest.py
            scripts/kb_pipeline_lib.py
            _system/profile/feed_map.json
            _system/profile/feed_inbox.jsonl
            _system/profile/deltas.md
            _system/profile/interests_seed.md
            _system/profile/feedback.md
            _system/profile/pinned_sources.md
            _system/meta/blogs-ingested.jsonl
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # curl-cffi: Chrome TLS impersonation for feed fetches — Substack's
        # Cloudflare 403s Python's native TLS fingerprint from Actions IPs.
        run: pip install 'anthropic>=0.40.0' 'curl-cffi>=0.7'

      - name: Run kb-blog-curator session
        env:
          # Anthropic credentials
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Agent + environment identifiers (from setup.py — stored as repo secrets)
          AGENT_ID:          ${{ secrets.AGENT_ID }}
          AGENT_VERSION:     ${{ secrets.AGENT_VERSION }}
          ENV_ID:            ${{ secrets.ENV_ID }}
          SEED_FILE_IDS:     ${{ secrets.SEED_FILE_IDS }}
          # KB repo — the agent clones this itself inside the session container.
          # Default: use the workflow's GITHUB_TOKEN (valid for the job's lifetime).
          # Alternative: set KB_REPO_PAT as a repo secret (PAT with contents:write)
          # if you need the token to outlive the workflow run, or want commits to
          # trigger other workflows (GITHUB_TOKEN-authored commits do NOT trigger).
          KB_REPO_URL:       ${{ github.server_url }}/${{ github.repository }}
          KB_REPO_TOKEN:     ${{ secrets.KB_REPO_PAT || secrets.GITHUB_TOKEN }}
          SLOT:              ${{ steps.slot.outputs.slot }}
          # Committer identity the agent uses. Set GIT_COMMITTER_EMAIL to a
          # GitHub-verified email on your account if you deploy the reader
          # (Vercel Hobby rejects unverifiable committers).
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME:  ${{ secrets.GIT_COMMITTER_NAME }}
          SINGLE_URL:        ${{ github.event.inputs.url || '' }}
        run: python scripts/run-blog-ingest.py
